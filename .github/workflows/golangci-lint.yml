name: golangci-lint

on:
  pull_request:
  push:
    branches:
      - master

jobs:

  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      # configuration in .golangci.yml, the linter must be built with the Go version above to type-check the code
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
