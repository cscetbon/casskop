apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  # The node runs 5.0 with a configuration generated for it and still serves the 4.1 data
  - script: |
      set -e
      POD=cassandra-e2e-dc1-rack1-0
      kubectl exec $POD -c cassandra -- nodetool version | grep -q 5.0.1
      kubectl exec $POD -c cassandra -- grep -q "jamm-0.4.0.jar" /etc/cassandra/cassandra-env.sh
      kubectl exec $POD -c cassandra -- grep -q "^storage_compatibility_mode: CASSANDRA_4" /etc/cassandra/cassandra.yaml
      kubectl exec $POD -c cassandra -- grep -q "^read_request_timeout: 5000ms" /etc/cassandra/cassandra.yaml
      kubectl exec $POD -c cassandra -- cqlsh -e "SELECT v FROM upgrade.data WHERE id = 1" | grep -q written-on-4.1
      kubectl exec $POD -c cassandra -- cqlsh -e "INSERT INTO upgrade.data (id, v) VALUES (3, 'written-on-5.0'); SELECT COUNT(*) FROM upgrade.data" | grep -qw 3
      kubectl exec $POD -c cassandra -- nodetool upgradesstables upgrade
